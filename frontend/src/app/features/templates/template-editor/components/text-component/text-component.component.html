@if (showContext && !infoMode && !readonly) {
  <div class="relative right-0 top-0 z-50" (mouseover)="showContext = true" (mouseleave)="showContext = false">
    <div class="absolute right-5 flex flex-row ml-auto drop-shadow-lg w-fit bg-white rounded-md">
      @if (!infoMode) {
        <button class="cursor-pointer px-2 py-1 text-xs" [title]="i18nStore.t('editor.components.insertLeft')" (click)="onInsertLeft.emit()">←</button>
      }
      @if (!infoMode) {
        <button class="cursor-pointer px-2 py-1 text-xs" [title]="i18nStore.t('editor.components.insertTop')" (click)="onInsertTop.emit()">↑</button>
      }
      @if (!infoMode) {
        <button class="cursor-pointer px-2 py-1 text-xs" [title]="i18nStore.t('editor.components.insertBottom')" (click)="onInsertBottom.emit()">↓</button>
      }
      @if (!infoMode) {
        <button class="cursor-pointer px-2 py-1 text-xs" [title]="i18nStore.t('editor.components.insertRight')" (click)="onInsertRight.emit()">→</button>
      }
      @if (!infoMode) {
        <button class="cursor-pointer px-2 py-1 text-xs" [title]="i18nStore.t('editor.components.edit')" (click)="openDialog()">✏️</button>
      }
      <button class="cursor-pointer px-2 py-1 text-xs text-red-500" [title]="i18nStore.t('editor.components.delete')" (click)="onDelete()">🗑</button>
    </div>
  </div>
}
<div (mouseover)="showContext = true" (mouseleave)="showContext = false">
  @if (!infoMode) {
    <div [innerHTML]="content"></div>
  } @else {
    <div class="flex items-center gap-2 px-2 py-1 rounded hover:bg-gray-100/70 transition-colors duration-100">
      <!-- Placed indicator dot -->
      @if (text.posX != undefined && text.posY != undefined) {
        <span class="shrink-0 w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
      }
      <!-- Text icon -->
      <div class="shrink-0 w-5 h-5 flex items-center justify-center rounded bg-indigo-100 text-indigo-600">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" />
        </svg>
      </div>
      <span class="text-xs text-gray-600 truncate">{{ text.blockName }}</span>
    </div>
  }
</div>

<ng-template #editText>
  <form [formGroup]="textForm">
    <div class="flex flex-col space-y-1">
      <div class="flex flex-row">
        <input class="p-2 border border-gray-300 rounded-md w-full" [placeholder]="i18nStore.t('editor.components.text.nameLabel')"
          formControlName="blockName">
      </div>
      <p-editor formControlName="blockContent" [style]="{ height: '300px' }"></p-editor>
    </div>
  </form>
</ng-template>
